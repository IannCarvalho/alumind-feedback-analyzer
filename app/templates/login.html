<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Entrar — FeedLens</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --fl-graphite: #171a23;
            --fl-mist: #f3f1ec;
            --fl-amber: #f2a93b;
            --fl-cyan: #2ba6b5;
            --fl-surface: #ffffff;
            --fl-text: #171a23;
            --fl-muted: #5c6070;
            --fl-border: #e2ddd2;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --fl-mist: #171a23;
                --fl-surface: #1f2430;
                --fl-text: #f3f1ec;
                --fl-muted: #9aa0b3;
                --fl-border: #333a4a;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--fl-mist);
            color: var(--fl-text);
            font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            padding: 1rem;
        }

        .card {
            background: var(--fl-surface);
            border: 1px solid var(--fl-border);
            border-radius: 12px;
            padding: 2rem 1.75rem;
            box-shadow: 0 2px 12px rgba(23, 26, 35, 0.06);
        }

        .brand {
            text-align: center;
            margin-bottom: 1.75rem;
        }

        .brand__name {
            font-size: 1.3rem;
            font-weight: 700;
            margin: 0.5rem 0 0;
        }

        .brand__tag {
            font-family: 'IBM Plex Mono', ui-monospace, monospace;
            font-size: 0.72rem;
            color: var(--fl-muted);
            margin: 0.15rem 0 0;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 0.4rem;
        }

        input[type="password"] {
            width: 100%;
            padding: 0.6rem 0.75rem;
            border: 1px solid var(--fl-border);
            border-radius: 8px;
            background: var(--fl-mist);
            color: var(--fl-text);
            font: inherit;
        }

        input[type="password"]:focus {
            outline: 2px solid var(--fl-cyan);
            outline-offset: 1px;
        }

        button {
            width: 100%;
            margin-top: 1.25rem;
            padding: 0.65rem;
            border: none;
            border-radius: 8px;
            background: var(--fl-amber);
            color: var(--fl-graphite);
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            filter: brightness(0.95);
        }

        .alert {
            padding: 0.6rem 0.75rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }

        .alert-danger {
            background: color-mix(in srgb, #d55e00 16%, transparent);
            color: #d55e00;
        }

        .alert-warning {
            background: color-mix(in srgb, var(--fl-amber) 20%, transparent);
            color: #a86f1d;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="card">
            <div class="brand">
                <svg width="40" height="40" viewBox="0 0 48 48" fill="none" aria-label="FeedLens">
                    <circle cx="24" cy="24" r="19" fill="none" stroke="currentColor" stroke-width="3" />
                    <path d="M2 14 L30 24 M2 24 L30 24 M2 34 L30 24" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" opacity="0.5" />
                    <circle cx="31" cy="24" r="4.5" fill="var(--fl-amber)" />
                </svg>
                <h1 class="brand__name">FeedLens</h1>
                <p class="brand__tag">traga sua lente</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="post" action="{{ url_for('auth.login', next=request.args.get('next', '')) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <label for="password">Senha de acesso</label>
                <input type="password" id="password" name="password" autocomplete="current-password" autofocus
                    required>
                <button type="submit">Entrar</button>
            </form>
        </div>
    </div>
</body>

</html>
