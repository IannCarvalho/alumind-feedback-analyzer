<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — FeedLens</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8f9fa;
        }

        .login-card {
            width: 100%;
            max-width: 380px;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="fas fa-brain fa-2x text-primary mb-2"></i>
                    <h1 class="h4 mb-0">FeedLens</h1>
                    <p class="text-muted small mb-0">Painel de feedbacks</p>
                </div>

                {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                {% for category, message in messages %}
                <div class="alert alert-{{ category }} py-2" role="alert">{{ message }}</div>
                {% endfor %}
                {% endif %}
                {% endwith %}

                <form method="post" action="{{ url_for('auth.login', next=request.args.get('next', '')) }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="password" class="form-label">Senha de acesso</label>
                        <input type="password" class="form-control" id="password" name="password"
                            autocomplete="current-password" autofocus required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-right-to-bracket me-1"></i>Entrar
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
