name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install -r requirements.txt
          fi
          pip install ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        env:
          OPENAI_API_KEY: test-key
          SECRET_KEY: test-secret
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          if [ -d tests ]; then
            pytest tests
          else
            echo "No tests directory yet; skipping."
          fi

  postgres:
    # Roda as migrations e a suíte contra um Postgres de verdade: o SQLite dos
    # testes acima não pega estouro de VARCHAR, FK, índices nem timestamptz.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: feedlens
          POSTGRES_PASSWORD: feedlens
          POSTGRES_DB: feedlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U feedlens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OPENAI_API_KEY: test-key
      SECRET_KEY: test-secret
      DATABASE_URL: postgresql://feedlens:feedlens@localhost:5432/feedlens
      FLASK_APP: wsgi:app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install -r requirements.txt
          fi

      - name: Migrations (upgrade, check, downgrade, upgrade)
        run: |
          flask db upgrade
          flask db check
          flask db downgrade base
          flask db upgrade
          flask db downgrade base

      - name: Run tests on Postgres
        run: pytest tests